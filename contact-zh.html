    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }
  .search-panel button:hover { background: #2170b8; }

  /* ---------- Hero band ---------- */
  .hero-band {
    width: 100%;
    background: linear-gradient(135deg, #0d1b2a 0%, #17324d 55%, #1c4a75 100%);
    color: #ffffff;
    position: relative;
    overflow: hidden;
  }
  .hero-band::before {
    content: '';
    position: absolute;
    top: -216px; right: -216px;
    width: 672px; height: 672px;
    background: radial-gradient(circle, rgba(55,138,221,0.35) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-inner {
    max-width: 1392px;
    margin: 0 auto;
    padding: 86px 38px 77px;
    position: relative;
  }
  .hero-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #7bb8ec;
    margin-bottom: 14px;
  }
  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(41px, 5vw, 67px);
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    max-width: 984px;
    margin-bottom: 22px;
  }
  .hero-title.oneline {
    white-space: nowrap;
    font-size: clamp(24px, 4.4vw, 60px);
    max-width: none;
  }
  @media (max-width: 560px) {
    .hero-title.oneline {
      white-space: normal;
      font-size: clamp(24px, 8vw, 38px);
    }
  }
  .hero-sub {
    font-size: 20px;
    line-height: 1.7;
    color: #cfe0f0;
    max-width: 816px;
  }
  .hero-address {
    font-size: 16px;
    color: #7bb8ec;
    font-weight: 600;
    margin-top: 20px;
  }

  /* ---------- Section bands ---------- */
  .section {
    width: 100%;
  }
  .section.bg-light { background: #f4f7fa; }
  .section.bg-white { background: #ffffff; }
  .section-inner {
    max-width: 1392px;
    margin: 0 auto;
    padding: 77px 38px;
  }
  .section-inner.tight { padding: 58px 38px; }
  .section-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #378ADD;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: clamp(29px, 3vw, 38px);
    color: #0d1b2a;
    text-transform: uppercase;
    letter-spacing: 0.005em;
    margin-bottom: 26px;
  }
  .section-title.center { text-align: center; }
  .body-text {
    font-size: 19px;
    color: #495563;
    line-height: 1.75;
    margin-bottom: 22px;
    max-width: 912px;
  }
  .body-text.center { max-width: 840px; margin-left: auto; margin-right: auto; text-align: center; }
  .body-text strong { color: #0d1b2a; }

  .divider-thin { height: 1px; background: rgba(13,27,42,0.08); }

  /* ---------- Tabs ---------- */
  .tab-radio { display: none; }
  .tab-nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 34px;
    border-bottom: 1px solid rgba(13,27,42,0.1);
  }
  .tab-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.03em;
    color: #566270;
    text-transform: uppercase;
    cursor: pointer;
    padding: 12px 6px;
    margin-bottom: -1px;
    border-bottom: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-label:hover { color: #2170b8; }
  .tab-panel { display: none; }
  #tab-2526:checked ~ .tab-nav label[for="tab-2526"],
  #tab-2627:checked ~ .tab-nav label[for="tab-2627"] {
    color: #0d1b2a;
    border-bottom-color: #378ADD;
  }
  #tab-2526:checked ~ #panel-2526 { display: block; }
  #tab-2627:checked ~ #panel-2627 { display: block; }

  /* ---------- Cards / grids ---------- */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 17px; }
  @media (max-width: 860px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .grid-5 { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: #ffffff;
    border: 1px solid rgba(13,27,42,0.08);
    border-left: 3px solid #378ADD;
    padding: 29px 31px;
  }
  .section.bg-light .card { background: #ffffff; }
  .section.bg-white .card { background: #f4f7fa; border: 1px solid rgba(13,27,42,0.06); border-left: 3px solid #378ADD; }

  .card-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #378ADD;
    margin-bottom: 7px;
  }
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: #0d1b2a;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
    line-height: 1.25;
  }
  .card-tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: #2170b8;
    background: rgba(55,138,221,0.12);
    padding: 4px 12px;
    margin-bottom: 17px;
    letter-spacing: 0.05em;
  }
  .card ul { list-style: none; }
  .card ul li {
    font-size: 16px;
    color: #566270;
    line-height: 1.55;
    padding-left: 17px;
    position: relative;
    margin-bottom: 7px;
  }
  .card ul li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: rgba(55,138,221,0.6);
    font-size: 14px;
  }

  .stat-card {
    background: #ffffff;
    border-top: 3px solid #378ADD;
    padding: 24px 22px;
    text-align: center;
  }
  .section.bg-white .stat-card { background: #f4f7fa; }
  .stat-label { font-size: 14px; color: #566270; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 7px; }
  .stat-value { font-size: 17px; color: #2b3946; line-height: 1.5; }

  .pull-box {
    background: #ffffff;
    border-left: 4px solid #378ADD;
    padding: 26px 31px;
    margin-top: 26px;
    font-size: 18px;
    color: #2b3946;
    line-height: 1.65;
    max-width: 912px;
  }
  .section.bg-white .pull-box { background: #f4f7fa; }
  .pull-box strong { color: #2170b8; }

  /* SPARK grid */
  .spark-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 17px; margin: 34px 0; }
  @media (max-width: 860px) { .spark-grid { grid-template-columns: repeat(2, 1fr); } }
  .spark-item { background: #ffffff; border-top: 3px solid #378ADD; padding: 22px 14px 24px; text-align: center; }
  .section.bg-white .spark-item { background: #f4f7fa; }
  .spark-letter { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 46px; color: #378ADD; line-height: 1; margin-bottom: 12px; }
  .spark-word { font-size: 16px; color: #566270; line-height: 1.4; font-weight: 500; }

  .why-grid { display: grid; grid-template-columns: 1fr; gap: 17px; margin-top: 12px; }
  .why-item { display: flex; gap: 16px; background: #ffffff; border-left: 3px solid #378ADD; padding: 18px 22px; }
  .section.bg-light .why-item { background: #ffffff; }
  .why-letter { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; color: #378ADD; flex-shrink: 0; width: 41px; }
  .why-body-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.05em; text-transform: uppercase; color: #0d1b2a; margin-bottom: 5px; }
  .why-body-text { font-size: 17px; color: #495563; line-height: 1.6; }

  /* FAQ accordion */
  .faq-item { border-bottom: 1px solid rgba(13,27,42,0.1); padding: 20px 0; }
  .faq-item:first-of-type { border-top: 1px solid rgba(13,27,42,0.1); }
  .faq-question {
    font-weight: 600; font-size: 20px; color: #0d1b2a; cursor: pointer;
    list-style: none; display: flex; align-items: baseline; gap: 17px;
    position: relative; padding-right: 36px;
  }
  .faq-question::-webkit-details-marker { display: none; }
  .faq-question::after {
    content: '+'; position: absolute; right: 0; top: 0;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #378ADD;
  }
  .faq-item[open] .faq-question::after { content: '\2212'; }
  .faq-num { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 17px; color: #378ADD; flex-shrink: 0; }
  .faq-answer { font-size: 18px; color: #495563; line-height: 1.7; margin-top: 14px; padding-left: 41px; max-width: 912px; }

  /* Contact */
  .contact-card {
    background: #ffffff;
    border-top: 3px solid #378ADD;
    padding: 38px 43px;
    max-width: 576px;
  }
  .contact-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; color: #2170b8; margin-bottom: 12px; }
  .contact-email { font-size: 25px; font-weight: 600; color: #0d1b2a; }
  .contact-email a { color: #0d1b2a; text-decoration: none; border-bottom: 2px solid #378ADD; }
  .contact-email a:hover { color: #2170b8; }

  /* Article (Tournaments) */
  .article-img { width: 100%; border: 1px solid rgba(13,27,42,0.08); }
  .article-img-row { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; margin: 10px 0 31px; }
  @media (max-width: 700px) { .article-img-row { grid-template-columns: 1fr; } }

  /* Footer */
  .site-footer {
    width: 100%;
    background: #0d1b2a;
    color: #b9c4cf;
  }
  .footer-inner {
    max-width: 1392px;
    margin: 0 auto;
    padding: 48px 38px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 19px;
  }
  .footer-left {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8fa0b0;
  }
  .footer-badge {
    background: rgba(55,138,221,0.18);
    border: 1px solid rgba(55,138,221,0.4);
    padding: 7px 19px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #7bb8ec;
  }
  .footer-copyright {
    max-width: 1392px;
    margin: 0 auto;
    padding: 0 38px 29px;
    font-size: 13px;
    color: #6b7a89;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-top: 20px;
  }
  .footer-nav { display: flex; gap: 22px; flex-wrap: wrap; }
  .footer-nav a {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #b9c4cf;
    text-decoration: none;
  }
  .footer-nav a:hover { color: #7bb8ec; }

  body { font-family: 'Noto Sans SC', 'Barlow', sans-serif; }
  .hero-title, .header-title, .section-title, .card-title, .why-body-title, .spark-word, .header-eyebrow, .hero-eyebrow, .section-eyebrow, .card-eyebrow, .footer-left, .footer-badge, .footer-nav a, .site-nav a { font-family: 'Noto Sans SC', 'Barlow Condensed', sans-serif; }
</style>
